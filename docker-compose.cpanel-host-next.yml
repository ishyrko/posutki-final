# Bind .next на хост для заливки на cPanel (без лимита памяти).
# make frontend-build-cpanel-prod-local
services:
  frontend:
    volumes:
      - ./frontend:/app
      # Перекрывает frontend_next_cache из docker-compose.yml — .next должен быть на хосте для заливки.
      - ./frontend/.next:/app/.next
      - frontend_node_modules:/app/node_modules
