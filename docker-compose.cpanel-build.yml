# Лимит 3 GB — smoke-тест как на shared hosting / CloudLinux LVE.
# make frontend-build-cpanel-prod
# make frontend-build-cpanel-verify-3g
# Для обычного локального деплоя: make frontend-build-cpanel-prod-local
services:
  frontend:
    mem_limit: 3g
    memswap_limit: 3g
    oom_kill_disable: false
